name: Moodle Plugin CI

on:
  push:
    branches:
      - main
      - 'MOODLE_*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Moodle 4.5 is the deployment target. PHP 8.1 is its minimum and 8.3
        # its maximum, so both ends of the supported range are exercised.
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'mariadb'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, zip, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
        env:
          # Authenticate Composer against the GitHub API. Without this, several
          # matrix jobs pulling from codeload at once get rate limited with a
          # 429 and the whole job fails before any check runs.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Add the service layer dependency
        # mod_saylorcode declares a dependency on local_saylorcode, so the
        # service layer has to be present before Moodle will install this
        # plugin at all.
        run: moodle-plugin-ci add-plugin saylordotorg/moodle-local_saylorcode

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        # One warning is expected and cannot be avoided: the vendored
        # CodeMirror bundle is declared in thirdpartylibs.xml, which puts it in
        # .eslintignore, and grunt then reports that it passed an ignored file.
        # The alternatives are worse - dropping the attribution so it gets
        # linted, or shipping the bundle without a source, which makes grunt
        # prune the built file. Any second warning still fails this step.
        run: moodle-plugin-ci grunt --max-lint-warnings 1

      - name: Set up Node for the JavaScript tests
        if: ${{ !cancelled() }}
        # Explicit rather than relying on the node moodle-plugin-ci installs
        # through nvm for grunt, which is not reliably on PATH outside its own
        # commands. Placed after grunt so it cannot change the node that step
        # used.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript unit tests
        if: ${{ !cancelled() }}
        # Runs against the checked out plugin rather than the copy inside
        # Moodle, and after grunt, so the node_modules this installs is never
        # in the tree grunt lints. moodle-plugin-ci has no step for this:
        # Moodle ships no JavaScript test runner, so the AMD modules had no
        # coverage of any kind until this was added.
        working-directory: plugin
        run: |
          npm ci
          npm test

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
